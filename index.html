    <title>FLAP</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2370C5CE'/%3E%3Cellipse cx='32' cy='34' rx='18' ry='16' fill='%23F8D64E'/%3E%3Ccircle cx='40' cy='30' r='5' fill='%23fff'/%3E%3Ccircle cx='41.5' cy='30' r='2.2' fill='%231A1208'/%3E%3Cpolygon points='48,33 60,36 48,40' fill='%23FF9F1C'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body,
      canvas {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      html {
        -webkit-text-size-adjust: 100%;
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #70c5ce;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
        height: 100%;
        height: 100dvh;
      }
      canvas {
        display: block;
        position: fixed;
        left: 0;
        top: 0;
        cursor: pointer;
        outline: none;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <canvas
      id="g"
      tabindex="0"
      role="application"
      aria-label="FLAP. Tap, click, or press Space to fly. Esc or P pauses. M mutes."
    ></canvas>
    <p id="sr" class="sr" aria-live="polite">
      FLAP. Tap, click, or press Space to fly.
    </p>
    <noscript>FLAP needs JavaScript enabled to play.</noscript>
    <script>
      (() => {
        "use strict";
        const C = document.getElementById("g");
        if (!C) return;
        let X = null;
        try {
          X = C.getContext("2d", { alpha: false, desynchronized: true });
        } catch (e) {}
        if (!X)
          try {
            X = C.getContext("2d", { alpha: false });
          } catch (e) {}
        if (!X) X = C.getContext("2d");
        if (!X) {
          document.body.textContent = "FLAP needs a canvas-capable browser.";
          return;
        }
        const HS = "flap-best-v1",
          MS = "flap-mute-v1";
        const G = 0.52,
          JMP = -8.15,
          MF = 11.2,
          BASE = 2.72;
        const mqReduce = matchMedia("(prefers-reduced-motion: reduce)");
        let reduce = mqReduce.matches;
        function say(msg) {
          const el = document.getElementById("sr");
          if (el) el.textContent = msg;
        }

        function lsGet(k) {
          try {
            return localStorage.getItem(k);
          } catch (e) {
            return null;
          }
        }
        function lsSet(k, v) {
          try {
            localStorage.setItem(k, v);
          } catch (e) {}
        }

        let W = 0,
          H = 0,
          DPR = 1,
          U = 1,
          GH = 80,
          SAT = 0,
          SAB = 0,
          SAL = 0,
          SAR = 0;
        let last = 0,
          acc = 0,
          st = "ready",
          score = 0,
          best = +(lsGet(HS) || 0),
          died = 0,
          flash = 0,
          shake = 0,
          cam = 0,
          punch = 1;
        let spd = 0,
          bird,
          pipes,
          parts,
          clouds,
          hills,
          groundX = 0,
          muted = lsGet(MS) === "1",
          pauseBtns = [],
          hudBtns = [];

        let AC = null,
          audioOk = 0;
        function audio() {
          if (!AC) {
            try {
              AC = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
              return null;
            }
          }
          if (AC.state === "suspended") AC.resume();
          if (!audioOk && AC) {
            try {
              const b = AC.createBuffer(1, 1, 22050),
                s = AC.createBufferSource();
              s.buffer = b;
              s.connect(AC.destination);
              s.start(0);
            } catch (e) {}
            audioOk = 1;
          }
          return AC;
        }
        function sfx(kind) {
          if (muted) return;
          const a = audio();
          if (!a) return;
          const t = Math.max(a.currentTime, 0) + 0.001,
            pv = 0.94 + Math.random() * 0.12;
          const beep = (type, f0, f1, dur, vol, wave) => {
            const o = a.createOscillator(),
              g = a.createGain();
            o.type = wave || type;
            o.connect(g);
            g.connect(a.destination);
            o.frequency.setValueAtTime(f0, t);
            if (f1)
              o.frequency.exponentialRampToValueAtTime(
                Math.max(1, f1),
                t + dur,
              );
            g.gain.setValueAtTime(vol, t);
            g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
            o.start(t);
            o.stop(t + dur + 0.02);
          };
          if (kind === "jump")
            beep("sine", 620 * pv, 420 * pv, 0.07, 0.1, "sine");
          else if (kind === "score") {
            beep("triangle", 880 * pv, 0, 0.05, 0.085, "triangle");
            const o = a.createOscillator(),
              g = a.createGain();
            o.type = "triangle";
            o.connect(g);
            g.connect(a.destination);
            o.frequency.setValueAtTime(1320 * pv, t + 0.05);
            g.gain.setValueAtTime(0.08, t + 0.05);
            g.gain.exponentialRampToValueAtTime(0.0008, t + 0.16);
            o.start(t + 0.05);
            o.stop(t + 0.18);
          } else {
            beep("square", 220 * pv, 55, 0.28, 0.12, "square");
            try {
              const n = a.createBufferSource(),
                len = Math.max(1, a.sampleRate * 0.16),
                buf = a.createBuffer(1, len, a.sampleRate),
                d = buf.getChannelData(0);
              for (let i = 0; i < len; i++)
                d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.6);
              const ng = a.createGain();
              n.buffer = buf;
              n.connect(ng);
              ng.connect(a.destination);
              ng.gain.setValueAtTime(0.11, t);
              ng.gain.exponentialRampToValueAtTime(0.0008, t + 0.16);
              n.start(t);
            } catch (e) {}
          }
        }

        function cssPx(name) {
          const v = getComputedStyle(document.documentElement)
            .getPropertyValue(name)
            .trim();
          const n = parseFloat(v);
          return isFinite(n) ? n : 0;
        }

        function fit() {
          const oldW = W,
            oldH = H,
            oldU = U,
            oldGH = GH,
            oldPlay = Math.max(1, oldH - oldGH);
          const vv = window.visualViewport;
          let w = innerWidth,
            h = innerHeight,
            ox = 0,
            oy = 0;
          if (vv && vv.width && vv.height) {
            w = vv.width;
            h = vv.height;
            ox = vv.offsetLeft || 0;
            oy = vv.offsetTop || 0;
          }
          W = Math.max(1, Math.round(w));
          H = Math.max(1, Math.round(h));
          DPR = Math.max(1, Math.min(devicePixelRatio || 1, 2.5));
          C.width = Math.max(1, Math.round(W * DPR));
          C.height = Math.max(1, Math.round(H * DPR));
          C.style.width = W + "px";
          C.style.height = H + "px";
          C.style.left = ox + "px";
          C.style.top = oy + "px";
          X.setTransform(DPR, 0, 0, DPR, 0, 0);
          X.imageSmoothingEnabled = true;
          SAT = cssPx("--sat");
          SAB = cssPx("--sab");
          SAL = cssPx("--sal");
          SAR = cssPx("--sar");
          U = Math.max(0.42, Math.min(H / 640, W / 390, 2.4));
          GH = Math.max(72 * U, H * 0.12 + SAB);
          if (bird && oldW > 0 && oldH > 0) {
            const play = Math.max(1, H - GH),
              sx = W / oldW,
              sy = play / oldPlay,
              su = U / oldU;
            bird.x *= sx;
            bird.y = Math.min(play - 8, Math.max(8, bird.y * sy));
            bird.s = 42 * U;
            bird.vy *= su;
            for (const p of pipes) {
              p.x *= sx;
              p.w = 68 * U;
              p.gap *= sy;
              p.mid *= sy;
            }
            for (const c of clouds) {
              c.x *= sx;
              c.y = Math.min(H * 0.5, c.y * sy);
              c.s *= su;
            }
            for (const hi of hills) {
              hi.x *= sx;
              hi.w *= sx;
              hi.h *= su;
            }
            spd = BASE * U;
          }
        }

        function mkBird() {
          return {
            x: Math.min(Math.max(72 * U, W * 0.18 + SAL), W * 0.28),
            y: (H - GH) * 0.42,
            vy: 0,
            s: 42 * U,
            sx: 1,
            sy: 1,
            rot: 0,
            wing: 0,
          };
        }
        function resetWorld() {
          bird = mkBird();
          pipes = [];
          parts = [];
          clouds = [];
          hills = [];
          groundX = 0;
          spd = BASE * U;
          score = 0;
          punch = 1;
          cam = 0;
          flash = 0;
          shake = 0;
          for (let i = 0; i < 7; i++)
            clouds.push({
              x: Math.random() * W,
              y: (H - GH) * (0.08 + Math.random() * 0.42),
              s: (0.55 + Math.random() * 0.9) * U,
              v: 0.18 + Math.random() * 0.22,
            });
          for (let i = 0; i < 5; i++)
            hills.push({
              x: i * W * 0.46,
              w: W * 0.55,
              h: (40 + Math.random() * 50) * U,
              c: i & 1,
            });
        }
        function spawnPipe(first) {
          const play = Math.max(80, H - GH);
          const birdH = bird.s * 0.72;
          let minGap = Math.max(birdH * 3.15, play * 0.24, 108 * U);
          let maxGap = Math.min(play * 0.4, minGap + 32 * U);
          if (maxGap < minGap) maxGap = minGap;
          let gap = minGap + Math.random() * Math.max(0, maxGap - minGap);
          const margin = Math.max(birdH * 1.15, play * 0.08, 28 * U);
          let lo = margin + gap * 0.5,
            hi = play - margin - gap * 0.5,
            mid;
          if (hi <= lo + 4) {
            gap = Math.min(
              Math.max(birdH * 2.9, play * 0.28),
              play - margin * 2,
            );
            lo = margin + gap * 0.5;
            hi = play - margin - gap * 0.5;
            mid = play * 0.5;
          } else {
            mid = lo + Math.random() * (hi - lo);
            if (first) {
              const prefer = Math.max(lo, Math.min(hi, bird.y));
              mid = prefer * 0.65 + (lo + Math.random() * (hi - lo)) * 0.35;
            }
          }
          const dist = first
            ? Math.max(260 * U, Math.min(340 * U, W * 0.55))
            : 0;
          const x = first
            ? bird.x + dist
            : pipes.length
              ? pipes[pipes.length - 1].x + Math.max(210 * U, 248 * U)
              : W + 8 * U;
          pipes.push({ x, w: 68 * U, gap, mid, hit: 0 });
        }

        function burst(x, y, n, cols, pow) {
          if (reduce) n = Math.min(n, 6);
          for (let i = 0; i < n; i++) {
            const a = Math.random() * Math.PI * 2,
              p = pow * (0.35 + Math.random());
            parts.push({
              x,
              y,
              vx: Math.cos(a) * p,
              vy: Math.sin(a) * p - p * 0.3,
              life: 1,
              dec: 0.014 + Math.random() * 0.02,
              sz: (2.2 + Math.random() * 3.4) * U,
              c: cols[i % cols.length],
              g: 0.18,
            });
          }
        }

        function pause() {
          if (st === "play") {
            st = "paused";
            last = 0;
            acc = 0;
            say("Paused. Score " + score + ". Best " + best + ".");
          }
        }
        function resume() {
          if (st === "paused") {
            st = "play";
            last = 0;
            acc = 0;
            say("Resumed.");
          }
        }
        function restart() {
          resetWorld();
          st = "play";
          spawnPipe(1);
          last = 0;
          acc = 0;
          say("Restarted.");
          flapPlay();
        }
        function menu() {
          resetWorld();
          st = "ready";
          last = 0;
          acc = 0;
        }
        function flapPlay() {
          bird.vy = JMP * U;
          bird.sx = 0.78;
          bird.sy = 1.26;
          bird.wing = 1;
          burst(
            bird.x - bird.s * 0.2,
            bird.y + bird.s * 0.15,
            7,
            ["#fff", "#F8E08A", "#E8D5A3"],
            2.6 * U,
          );
          sfx("jump");
          if (navigator.vibrate)
            try {
              navigator.vibrate(8);
            } catch (e) {}
        }
        function flap() {
          audio();
          if (st === "ready") {
            st = "play";
            if (!pipes.length) spawnPipe(1);
            say("Flying.");
            flapPlay();
            return;
          }
          if (st === "play") {
            flapPlay();
            return;
          }
          if (st === "over" && performance.now() - died > 480) {
            restart();
          }
        }
        function toggleMute() {
          muted = !muted;
          lsSet(MS, muted ? "1" : "0");
          say(muted ? "Sound off." : "Sound on.");
        }

        function hit() {
          if (st !== "play") return;
          st = "over";
          died = performance.now();
          flash = 1;
          shake = reduce ? 0 : 1;
          burst(
            bird.x,
            bird.y,
            22,
            ["#F8D64E", "#F5A623", "#fff", "#E24B4B", "#FFD87A"],
            5.2 * U,
          );
          sfx("hit");
          say(
            "Game over. Score " + score + ". Best " + best + ". Tap to retry.",
          );
          if (navigator.vibrate)
            try {
              navigator.vibrate([18, 30, 40]);
            } catch (e) {}
        }

        function box(ax, ay, aw, ah, bx, by, bw, bh) {
          return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
        }

        function update(f) {
          const b = bird,
            now = performance.now();
          groundX = (groundX - spd * f) % (24 * U);
          for (const c of clouds) {
            c.x -= spd * c.v * f;
            if (c.x < -140 * U) c.x = W + 50 * U;
          }
          for (const h of hills) {
            h.x -= spd * 0.35 * f;
            if (h.x < -h.w) h.x += h.w * 5;
          }

          for (let i = parts.length - 1; i >= 0; i--) {
            const p = parts[i];
            p.x += p.vx * f;
            p.y += p.vy * f;
            p.vy += p.g * U * f;
            p.life -= p.dec * f;
            if (p.life <= 0) parts.splice(i, 1);
          }
          if (parts.length > 70) parts.splice(0, parts.length - 70);

          punch += (1 - punch) * 0.16 * f;
          flash = Math.max(0, flash - 0.045 * f);
          shake = Math.max(0, shake - 0.06 * f);
          cam += (b.vy * 0.08 - cam) * 0.14 * f;
          b.sx += (1 - b.sx) * 0.16 * f;
          b.sy += (1 - b.sy) * 0.16 * f;
          b.wing = Math.max(0, b.wing - 0.08 * f);

          if (st === "ready" || st === "paused") {
            if (st === "ready") {
              b.y =
                (H - GH) * 0.42 + Math.sin(now * 0.005) * (reduce ? 0 : 7 * U);
              b.vy = 0;
              b.rot = 0;
            }
            return;
          }

          b.vy += G * U * f;
          if (b.vy > MF * U) b.vy = MF * U;
          b.y += b.vy * f;
          const tgt = Math.max(-0.85, Math.min(1.35, (b.vy / (MF * U)) * 1.55));
          b.rot += (tgt - b.rot) * 0.18 * f;
          if (b.vy > 4 * U) {
            b.sx += (1.14 - b.sx) * 0.08 * f;
            b.sy += (0.86 - b.sy) * 0.08 * f;
          }

          if (st === "over") {
            if (b.y + b.s * 0.38 > H - GH) {
              b.y = H - GH - b.s * 0.38;
              b.vy = 0;
              b.rot = 1.4;
            }
            return;
          }

          spd = (BASE + Math.min(score, 50) * 0.048) * U;
          const spacing = Math.max(210 * U, 248 * U);
          if (!pipes.length || pipes[pipes.length - 1].x < W - spacing)
            spawnPipe(0);

          const hw = b.s * 0.33,
            hh = b.s * 0.31,
            hx = b.x - hw,
            hy = b.y - hh;
          for (const p of pipes) {
            p.x -= spd * f;
            const topH = p.mid - p.gap * 0.5,
              botY = p.mid + p.gap * 0.5,
              botH = H - GH - botY;
            if (
              box(hx, hy, hw * 2, hh * 2, p.x, 0, p.w, topH) ||
              (botH > 0 && box(hx, hy, hw * 2, hh * 2, p.x, botY, p.w, botH))
            )
              hit();
            if (!p.hit && p.x + p.w < b.x) {
              p.hit = 1;
              score++;
              punch = 1.28;
              if (score > best) {
                best = score;
                lsSet(HS, best);
              }
              sfx("score");
            }
          }
          while (pipes.length && pipes[0].x + pipes[0].w < -40) pipes.shift();
          if (b.y + hh > H - GH || b.y - hh < 0) hit();
        }

        function roundRect(x, y, w, h, r) {
          const rr = Math.min(r, w / 2, h / 2);
          X.beginPath();
          X.moveTo(x + rr, y);
          X.arcTo(x + w, y, x + w, y + h, rr);
          X.arcTo(x + w, y + h, x, y + h, rr);
          X.arcTo(x, y + h, x, y, rr);
          X.arcTo(x, y, x + w, y, rr);
          X.closePath();
        }

        function drawSky() {
          const g = X.createLinearGradient(0, 0, 0, H);
          g.addColorStop(0, "#4EB8D0");
          g.addColorStop(0.45, "#7ED4E6");
          g.addColorStop(0.78, "#C8E8A8");
          g.addColorStop(1, "#E8D98A");
          X.fillStyle = g;
          X.fillRect(0, 0, W, H);
          const sunX = W * 0.78,
            sunY = Math.max(SAT + 36 * U, H * 0.16),
            sr = 38 * U;
          const sg = X.createRadialGradient(
            sunX,
            sunY,
            2,
            sunX,
            sunY,
            sr * 3.2,
          );
          sg.addColorStop(0, "rgba(255,236,150,0.95)");
          sg.addColorStop(0.35, "rgba(255,200,80,0.35)");
          sg.addColorStop(1, "rgba(255,180,60,0)");
          X.fillStyle = sg;
          X.beginPath();
          X.arc(sunX, sunY, sr * 3.2, 0, 7);
          X.fill();
          X.fillStyle = "#FFE99A";
          X.beginPath();
          X.arc(sunX, sunY, sr, 0, 7);
          X.fill();
        }
        function drawCloud(c) {
          X.fillStyle = "rgba(255,255,255,0.88)";
          const s = c.s * 42;
          X.beginPath();
          X.ellipse(c.x, c.y, s, s * 0.48, 0, 0, 7);
          X.ellipse(c.x + s * 0.55, c.y + s * 0.08, s * 0.72, s * 0.4, 0, 0, 7);
          X.ellipse(c.x - s * 0.5, c.y + s * 0.1, s * 0.62, s * 0.36, 0, 0, 7);
          X.fill();
        }
        function drawHills() {
          for (const h of hills) {
            X.fillStyle = h.c ? "#5AAE4A" : "#4E9A42";
            X.beginPath();
            X.moveTo(h.x, H - GH + 4);
            X.quadraticCurveTo(
              h.x + h.w * 0.5,
              H - GH - h.h,
              h.x + h.w,
              H - GH + 4,
            );
            X.fill();
          }
        }
        function drawPipe(p) {
          const x = p.x,
            w = p.w,
            topH = p.mid - p.gap * 0.5,
            botY = p.mid + p.gap * 0.5,
            botH = H - GH - botY,
            lip = 12 * U,
            cap = 10 * U;
          const body = "#5BB01F",
            dark = "#3D7A14",
            lit = "#8AD63A",
            edge = "#2E5C0E";
          function col(y, h, up) {
            if (h <= 1) return;
            const lg = X.createLinearGradient(x, 0, x + w, 0);
            lg.addColorStop(0, dark);
            lg.addColorStop(0.18, lit);
            lg.addColorStop(0.45, body);
            lg.addColorStop(0.82, dark);
            lg.addColorStop(1, edge);
            X.fillStyle = lg;
            X.fillRect(x + 2, y, w - 4, h);
            X.fillStyle = edge;
            X.fillRect(x + 2, y, 2.2 * U, h);
            X.fillRect(x + w - 4.2 * U, y, 2.2 * U, h);
            const cy = up ? y + h - cap : y;
            roundRect(x - lip * 0.35, cy, w + lip * 0.7, cap, 5 * U);
            X.fillStyle = lit;
            X.fill();
            X.strokeStyle = edge;
            X.lineWidth = 2 * U;
            X.stroke();
            X.fillStyle = "rgba(0,0,0,0.18)";
            if (up) X.fillRect(x + 3, y + h - cap - 6 * U, w - 6, 6 * U);
            else X.fillRect(x + 3, y + cap, w - 6, 6 * U);
          }
          col(0, topH, 1);
          col(botY, botH, 0);
        }
        function drawGround() {
          X.fillStyle = "#DED895";
          X.fillRect(0, H - GH, W, GH);
          X.fillStyle = "#5EBF2A";
          X.fillRect(0, H - GH, W, 18 * U);
          X.fillStyle = "#4AA01E";
          X.fillRect(0, H - GH + 18 * U, W, 6 * U);
          X.save();
          X.beginPath();
          X.rect(0, H - GH, W, 18 * U);
          X.clip();
          X.strokeStyle = "#3D7A14";
          X.lineWidth = 2 * U;
          for (let i = -1; i < W / (16 * U) + 3; i++) {
            const x = groundX + i * 16 * U;
            X.beginPath();
            X.moveTo(x, H - GH);
            X.lineTo(x + 8 * U, H - GH + 18 * U);
            X.stroke();
          }
          X.restore();
          X.fillStyle = "#C9B56A";
          for (let i = 0; i < W / (22 * U) + 3; i++)
            X.fillRect(
              groundX * 0.5 + i * 22 * U,
              H - GH + 32 * U,
              10 * U,
              5 * U,
            );
        }
        function drawBird() {
          const b = bird,
            s = b.s;
          X.save();
          X.translate(b.x, b.y + (reduce ? 0 : cam * 0.35));
          X.rotate(b.rot);
          X.scale(b.sx, b.sy);
          X.fillStyle = "rgba(0,0,0,0.16)";
          X.beginPath();
          X.ellipse(2 * U, s * 0.28, s * 0.42, s * 0.18, 0, 0, 7);
          X.fill();
          const wing =
            -0.55 +
            Math.sin(performance.now() * 0.018) * 0.55 * (0.35 + b.wing * 1.4);
          X.save();
          X.translate(-s * 0.08, s * 0.04);
          X.rotate(reduce ? -0.2 : wing);
          X.fillStyle = "#F0B429";
          X.beginPath();
          X.ellipse(0, 0, s * 0.34, s * 0.22, 0, 0, 7);
          X.fill();
          X.fillStyle = "#E09A14";
          X.beginPath();
          X.ellipse(-s * 0.04, s * 0.02, s * 0.22, s * 0.12, 0, 0, 7);
          X.fill();
          X.restore();
          X.fillStyle = "#F8D64E";
          X.beginPath();
          X.ellipse(0, 0, s * 0.46, s * 0.4, 0, 0, 7);
          X.fill();
          const hg = X.createRadialGradient(
            -s * 0.16,
            -s * 0.16,
            2,
            0,
            0,
            s * 0.5,
          );
          hg.addColorStop(0, "rgba(255,255,255,0.45)");
          hg.addColorStop(0.45, "rgba(248,214,78,0)");
          hg.addColorStop(1, "rgba(200,140,20,0.25)");
          X.fillStyle = hg;
          X.beginPath();
          X.ellipse(0, 0, s * 0.46, s * 0.4, 0, 0, 7);
          X.fill();
          X.fillStyle = "#F5C63A";
          X.beginPath();
          X.ellipse(s * 0.06, s * 0.16, s * 0.28, s * 0.16, 0.15, 0, 7);
          X.fill();
          X.fillStyle = "#FF9F1C";
          X.beginPath();
          X.moveTo(s * 0.38, -s * 0.04);
          X.lineTo(s * 0.72, s * 0.02);
          X.lineTo(s * 0.38, s * 0.1);
          X.closePath();
          X.fill();
          X.fillStyle = "#E8870A";
          X.fillRect(s * 0.4, s * 0.02, s * 0.28, 1.6 * U);
          X.fillStyle = "#fff";
          X.beginPath();
          X.arc(s * 0.16, -s * 0.1, s * 0.13, 0, 7);
          X.fill();
          X.strokeStyle = "#3A2A10";
          X.lineWidth = 1.4 * U;
          X.stroke();
          X.fillStyle = "#1A1208";
          X.beginPath();
          X.arc(s * 0.2, -s * 0.1, s * 0.055, 0, 7);
          X.fill();
          X.fillStyle = "#fff";
          X.beginPath();
          X.arc(s * 0.23, -s * 0.13, s * 0.022, 0, 7);
          X.fill();
          X.restore();
        }
        function text(str, x, y, size, fill, stroke, w) {
          X.font =
            "800 " + size + 'px system-ui,-apple-system,"Segoe UI",sans-serif';
          X.textAlign = "center";
          X.textBaseline = "middle";
          if (stroke) {
            X.lineJoin = "round";
            X.miterLimit = 2;
            X.strokeStyle = stroke;
            X.lineWidth = w || size * 0.14;
            X.strokeText(str, x, y);
          }
          X.fillStyle = fill;
          X.fillText(str, x, y);
        }
        function card(pw, ph, x, y) {
          X.fillStyle = "rgba(20,30,20,0.28)";
          roundRect(x + 4 * U, y + 6 * U, pw, ph, 18 * U);
          X.fill();
          X.fillStyle = "#F6F0D8";
          roundRect(x, y, pw, ph, 18 * U);
          X.fill();
          X.strokeStyle = "#C9B56A";
          X.lineWidth = 3 * U;
          X.stroke();
        }
        function btn(x, y, w, h, label, fill) {
          roundRect(x, y, w, h, 12 * U);
          X.fillStyle = fill || "#3A2A10";
          X.fill();
          text(
            label,
            x + w / 2,
            y + h / 2,
            Math.min(16 * U, h * 0.42),
            "#F6F0D8",
          );
          return { x, y, w, h };
        }
        function hudIcon(x, y, s, kind) {
          const hit = {
            x: x - s * 0.15,
            y: y - s * 0.15,
            w: s * 1.3,
            h: s * 1.3,
          };
          X.fillStyle = "rgba(58,42,16,0.38)";
          roundRect(x, y, s, s, 10 * U);
          X.fill();
          X.strokeStyle = "#fff";
          X.lineWidth = Math.max(2, s * 0.08);
          X.lineCap = "round";
          const cx = x + s / 2,
            cy = y + s / 2;
          if (kind === "pause") {
            X.beginPath();
            X.moveTo(cx - s * 0.12, cy - s * 0.18);
            X.lineTo(cx - s * 0.12, cy + s * 0.18);
            X.moveTo(cx + s * 0.12, cy - s * 0.18);
            X.lineTo(cx + s * 0.12, cy + s * 0.18);
            X.stroke();
          } else {
            X.beginPath();
            X.moveTo(cx - s * 0.18, cy);
            X.lineTo(cx - s * 0.02, cy - s * 0.16);
            X.lineTo(cx - s * 0.02, cy + s * 0.16);
            X.closePath();
            X.fillStyle = "#fff";
            X.fill();
            X.beginPath();
            X.arc(cx + s * 0.02, cy, s * 0.14, 1.2, 5.1);
            X.stroke();
            if (muted) {
              X.beginPath();
              X.moveTo(cx - s * 0.22, cy + s * 0.22);
              X.lineTo(cx + s * 0.22, cy - s * 0.22);
              X.strokeStyle = "#E24B4B";
              X.stroke();
            }
          }
          return hit;
        }
        function panel() {
          const pw = Math.min(300 * U, W - 24 - SAL - SAR),
            ph = Math.min(
              220 * U,
              Math.max(140 * U, H * 0.52),
              H - SAT - SAB - 24,
            ),
            x = (W - pw) / 2,
            y = Math.max(SAT + 8, Math.min(H * 0.28, H - ph - SAB - 12));
          card(pw, ph, x, y);
          text(
            "GAME OVER",
            W / 2,
            y + ph * 0.16,
            Math.min(28 * U, pw * 0.1),
            "#3A2A10",
            "#fff",
            6 * U,
          );
          text("SCORE", W / 2 - pw * 0.22, y + ph * 0.35, 12 * U, "#7A6A40");
          text(
            String(score),
            W / 2 - pw * 0.22,
            y + ph * 0.5,
            Math.min(36 * U, pw * 0.14),
            "#E24B4B",
            "#fff",
            5 * U,
          );
          text("BEST", W / 2 + pw * 0.22, y + ph * 0.35, 12 * U, "#7A6A40");
          text(
            String(best),
            W / 2 + pw * 0.22,
            y + ph * 0.5,
            Math.min(36 * U, pw * 0.14),
            "#E0A428",
            "#fff",
            5 * U,
          );
          if (score >= 10) {
            const m =
              score >= 100
                ? "PLATINUM"
                : score >= 50
                  ? "GOLD"
                  : score >= 25
                    ? "SILVER"
                    : "BRONZE";
            const mc =
              score >= 100
                ? "#3A8BB0"
                : score >= 50
                  ? "#C48916"
                  : score >= 25
                    ? "#6A7380"
                    : "#A05A28";
            text(m, W / 2, y + ph * 0.68, 14 * U, mc);
          }
          text("TAP TO RETRY", W / 2, y + ph - ph * 0.14, 14 * U, "#3A2A10");
        }
        function pauseMenu() {
          X.fillStyle = "rgba(20,40,40,0.42)";
          X.fillRect(0, 0, W, H);
          const pw = Math.min(300 * U, W - 24 - SAL - SAR),
            bh = Math.min(44 * U, Math.max(36, (H - SAT - SAB) * 0.11)),
            gap = 8 * U,
            ph = Math.min(H - SAT - SAB - 16, bh * 3 + gap * 4 + 72 * U);
          const x = (W - pw) / 2,
            y = Math.max(SAT + 8, Math.min((H - ph) / 2, H - ph - SAB - 8));
          card(pw, ph, x, y);
          text(
            "PAUSED",
            W / 2,
            y + 32 * U,
            Math.min(28 * U, pw * 0.12),
            "#3A2A10",
            "#fff",
            6 * U,
          );
          text(
            "SCORE  " + score + "    BEST  " + best,
            W / 2,
            y + 58 * U,
            13 * U,
            "#7A6A40",
          );
          const bw = pw - 40 * U,
            bx = x + 20 * U,
            by = y + 78 * U;
          pauseBtns = [
            Object.assign(btn(bx, by, bw, bh, "RESUME", "#3A8A22"), {
              id: "resume",
            }),
            Object.assign(
              btn(bx, by + bh + gap, bw, bh, "RESTART", "#3A2A10"),
              { id: "restart" },
            ),
            Object.assign(
              btn(
                bx,
                by + (bh + gap) * 2,
                bw,
                bh,
                muted ? "SOUND: OFF" : "SOUND: ON",
                "#3A2A10",
              ),
              { id: "mute" },
            ),
          ];
          text(
            "ESC  ·  P  ·  TAP OUTSIDE",
            W / 2,
            y + ph - 22 * U,
            11 * U,
            "#7A6A40",
          );
        }
        function drawUI() {
          const top = SAT + Math.max(26 * U, 36);
          const hs = Math.max(44, 40 * U);
          hudBtns = [];
          hudBtns.push(
            Object.assign(
              hudIcon(W - SAR - hs - 12 * U, SAT + 10 * U, hs, "mute"),
              { id: "mute" },
            ),
          );
          if (st === "play")
            hudBtns.push(
              Object.assign(hudIcon(12 * U + SAL, SAT + 10 * U, hs, "pause"), {
                id: "pause",
              }),
            );
          if (st === "play" || st === "over" || st === "paused") {
            X.save();
            X.translate(W / 2, top);
            X.scale(punch, punch);
            text(
              String(score),
              0,
              0,
              Math.min(52 * U, W * 0.14),
              "#fff",
              "#3A2A10",
              8 * U,
            );
            X.restore();
          }
          if (st === "ready") {
            text(
              "FLAP",
              W / 2,
              Math.max(top + 24, H * 0.2),
              Math.min(64 * U, W * 0.22),
              "#fff",
              "#3A2A10",
              10 * U,
            );
            text(
              "TAP  ·  CLICK  ·  SPACE",
              W / 2,
              Math.max(top + 70, H * 0.2 + 48 * U),
              14 * U,
              "rgba(255,255,255,0.92)",
              "#3A2A10",
              4 * U,
            );
            const pulse = reduce
              ? 1
              : 0.92 + Math.sin(performance.now() * 0.005) * 0.08;
            X.globalAlpha = pulse;
            text(
              "TAP TO FLY",
              W / 2,
              H * 0.6,
              22 * U,
              "#fff",
              "#3A2A10",
              6 * U,
            );
            X.globalAlpha = 1;
            if (best)
              text(
                "BEST  " + best,
                W / 2,
                H - GH - 22 * U,
                14 * U,
                "#fff",
                "#3A2A10",
                4 * U,
              );
          }
          if (st === "over") panel();
          if (st === "paused") pauseMenu();
        }
        function draw() {
          X.setTransform(DPR, 0, 0, DPR, 0, 0);
          const sx = shake ? (Math.random() - 0.5) * 10 * U * shake : 0,
            sy = shake ? (Math.random() - 0.5) * 8 * U * shake : 0;
          X.save();
          X.translate(sx, sy);
          drawSky();
          for (const c of clouds) drawCloud(c);
          drawHills();
          for (const p of pipes) drawPipe(p);
          drawGround();
          for (const p of parts) {
            X.globalAlpha = Math.max(0, p.life);
            X.fillStyle = p.c;
            X.beginPath();
            X.arc(p.x, p.y, p.sz, 0, 7);
            X.fill();
          }
          X.globalAlpha = 1;
          drawBird();
          X.restore();
          if (flash > 0) {
            X.fillStyle = "rgba(255,255,255," + flash * 0.55 + ")";
            X.fillRect(0, 0, W, H);
          }
          drawUI();
        }
        function loop(t) {
          requestAnimationFrame(loop);
          if (st === "paused") {
            last = 0;
            acc = 0;
            draw();
            return;
          }
          if (!last) {
            last = t;
            return;
          }
          let dt = (t - last) / 1000;
          last = t;
          if (dt > 0.05) dt = 0.05;
          if (dt < 0) dt = 0;
          acc += dt;
          const step = 1 / 60;
          let n = 0;
          while (acc >= step && n < 5) {
            update(1);
            acc -= step;
            n++;
          }
          draw();
        }

        function hitUI(list, x, y) {
          for (const b of list) {
            if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h)
              return b;
          }
          return null;
        }
        function canvasXY(e) {
          const r = C.getBoundingClientRect();
          const src = e.changedTouches ? e.changedTouches[0] : e;
          const rw = r.width || W || 1,
            rh = r.height || H || 1;
          return [
            (src.clientX - r.left) * (W / rw),
            (src.clientY - r.top) * (H / rh),
          ];
        }
        let lastTap = 0;
        function onPtr(e) {
          e.preventDefault();
          const now = performance.now();
          if (now - lastTap < 40) return;
          lastTap = now;
          const [x, y] = canvasXY(e);
          const hud = hitUI(hudBtns, x, y);
          if (hud) {
            if (hud.id === "pause") pause();
            else if (hud.id === "mute") toggleMute();
            return;
          }
          if (st === "paused") {
            const b = hitUI(pauseBtns, x, y);
            if (b) {
              if (b.id === "resume") resume();
              else if (b.id === "restart") restart();
              else if (b.id === "mute") toggleMute();
            } else resume();
            return;
          }
          flap();
        }
        function onKey(e) {
          if (e.repeat) return;
          const k = e.code || e.key;
          if (
            k === "Escape" ||
            k === "KeyP" ||
            e.key === "p" ||
            e.key === "P"
          ) {
            e.preventDefault();
            if (st === "play") pause();
            else if (st === "paused") resume();
            return;
          }
          if (k === "KeyM" || e.key === "m" || e.key === "M") {
            e.preventDefault();
            toggleMute();
            return;
          }
          if (
            st === "paused" &&
            (k === "KeyR" || e.key === "r" || e.key === "R")
          ) {
            e.preventDefault();
            restart();
            return;
          }
          if (k === "Space" || e.key === " " || e.key === "Enter") {
            e.preventDefault();
            if (st === "paused") resume();
            else flap();
          }
        }
        function onResize() {
          const was = st;
          fit();
          if (was === "ready") resetWorld();
        }

        addEventListener("resize", onResize, { passive: true });
        addEventListener("orientationchange", () => setTimeout(onResize, 120));
        if (window.visualViewport) {
          visualViewport.addEventListener("resize", onResize, {
            passive: true,
          });
          visualViewport.addEventListener("scroll", onResize, {
            passive: true,
          });
        }
        addEventListener("pointerdown", onPtr, { passive: false });
        addEventListener("keydown", onKey, { passive: false });
        addEventListener("contextmenu", (e) => e.preventDefault());
        addEventListener("touchmove", (e) => e.preventDefault(), {
          passive: false,
        });
        addEventListener("gesturestart", (e) => e.preventDefault());
        document.addEventListener("visibilitychange", () => {
          last = 0;
          acc = 0;
          if (document.hidden) {
            if (st === "play") pause();
          } else {
            fit();
            audio();
          }
        });
        addEventListener("blur", () => {
          if (st === "play") pause();
        });
        addEventListener("pagehide", () => {
          if (st === "play") pause();
        });
        addEventListener("pageshow", () => {
          last = 0;
          acc = 0;
          fit();
        });
        const onReduce = (e) => {
          reduce = !!(e && e.matches);
        };
        if (mqReduce.addEventListener)
          mqReduce.addEventListener("change", onReduce);
        else if (mqReduce.addListener) mqReduce.addListener(onReduce);

        fit();
        resetWorld();
        try {
          C.focus({ preventScroll: true });
        } catch (e) {
          try {
            C.focus();
          } catch (e2) {}
        }
        say("FLAP. Tap, click, or press Space to fly.");
        requestAnimationFrame(loop);
      })();
    </script>
  </body>
</html>
