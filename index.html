<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; font-src 'self'; media-src 'self'; base-uri 'self'; form-action 'self'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FLAP" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#70C5CE" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="FLAP — a tight, fullscreen Flappy Bird–style game with Daily Challenge, Practice, unlockable bird skins, local Top 10, and offline play. Tap, click, or press Space to fly."
    />
    <meta name="application-name" content="FLAP" />
    <meta name="robots" content="index,follow" />
    <meta name="author" content="FLAP" />
    <meta name="format-detection" content="telephone=no" />
    <link
      rel="canonical"
      href="https://siliconvalley007.github.io/Flappy-Bird/"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FLAP" />
    <meta property="og:title" content="FLAP — Daily Challenge" />
    <meta
      property="og:description"
      content="A tight, fullscreen Flappy Bird–style game with Daily Challenge, Practice, unlockable bird skins, and offline play."
    />
    <meta
      property="og:url"
      content="https://siliconvalley007.github.io/Flappy-Bird/"
    />
    <meta
      property="og:image"
      content="https://siliconvalley007.github.io/Flappy-Bird/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="FLAP — tap, click, or press Space to fly"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FLAP — Daily Challenge" />
    <meta
      name="twitter:description"
      content="A tight, fullscreen Flappy Bird–style game with Daily Challenge, Practice, unlockable bird skins, and offline play."
    />
    <meta
      name="twitter:image"
      content="https://siliconvalley007.github.io/Flappy-Bird/og-image.png"
    />
    <title>FLAP</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="icon-192.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
    <link rel="preload" href="style.css" as="style" />
    <link rel="preload" href="game.js" as="script" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas
      id="g"
      tabindex="0"
      role="application"
      aria-label="FLAP. Tap, click, Space, or gamepad A to fly. Esc or P pauses. M mutes. F toggles fullscreen."
      aria-roledescription="game"
    ></canvas>
    <p id="sr" class="sr" aria-live="polite">
      FLAP. Choose Classic, Daily, or Practice. Tap, click, or press Space to fly.
    </p>
    <button
      id="upd"
      class="upd"
      type="button"
      hidden
      aria-label="Update ready — tap to reload"
    >
      Update ready — tap to reload
    </button>
    <button
      id="install"
      class="install"
      type="button"
      hidden
      aria-label="Install FLAP"
    >
      INSTALL
    </button>
    <div id="crash" class="crash" hidden role="alert">
      <p>Something went wrong.</p>
      <button id="reload" class="reload" type="button" aria-label="Reload FLAP">
        RELOAD
      </button>
    </div>
    <noscript>FLAP needs JavaScript enabled to play.</noscript>
    <script src="game.js"></script>
  </body>
</html>
